name: Sync body scale

on:
  schedule:
    - cron: '23 19 * * *' # 03:23 China Standard Time
  workflow_dispatch:
    inputs:
      quantity:
        description: 'Number of recent records to retrieve (use 100 for a historical backfill)'
        required: true
        type: number
        default: 100

permissions:
  contents: write

concurrency:
  group: body-scale-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch scale data
        env:
          SCALE_UNION_ID: ${{ secrets.SCALE_UNION_ID }}
          SCALE_USER_ID: ${{ secrets.SCALE_USER_ID }}
          SCALE_QUANTITY: ${{ inputs.quantity || '100' }}
        run: python scale_sync.py
      - name: Commit updated CSV
        run: |
          git add data/body_scale.csv
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update body scale data'
          git push
